<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      background: #eef2f7;
      font-family: 'Segoe UI', sans-serif;
    }

    .sidebar {
      width: 260px; height: 100vh; background: linear-gradient(180deg, #1d3679 0%, #172b5e 100%);
      color: white; position: fixed; inset: 0 auto 0 0; padding: 18px 14px; overflow-x: hidden; overflow-y: auto;
      z-index: 1040; transition: width .25s ease, padding .25s ease, transform .25s ease;
      box-shadow: 8px 0 24px rgba(20, 36, 78, .12);
    }
    .sidebar-brand { display:flex; align-items:center; gap:10px; padding:4px 8px 12px; white-space:nowrap; }
    .sidebar-brand-icon { display:grid; place-items:center; width:36px; height:36px; flex:0 0 36px; border-radius:11px; background:rgba(255,255,255,.14); font-size:18px; }
    .sidebar a { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sidebar a i { display:inline-block; width:24px; text-align:center; font-size:17px; }
    .sidebar-toggle { border:1px solid #dbe2ee; background:#fff; color:#253b70; border-radius:10px; width:40px; height:40px; display:inline-grid; place-items:center; flex:0 0 40px; }
    .sidebar-toggle:hover { background:#eef3ff; }
    body.sidebar-collapsed .sidebar { width:78px; padding:18px 10px; }
    body.sidebar-collapsed .main { margin-left:78px; }
    body.sidebar-collapsed .sidebar-brand-text, body.sidebar-collapsed .sidebar-link-text { display:none; }
    body.sidebar-collapsed .sidebar a { text-align:center; padding:12px 6px; }
    body.sidebar-collapsed .sidebar a i { width:auto; }
    body.sidebar-collapsed .sidebar hr { opacity:.25; }
    .sidebar-backdrop { display:none; }
    @media (max-width: 768px) {
      .sidebar { transform:translateX(-100%); width:260px; }
      body.mobile-menu-open .sidebar { transform:translateX(0); }
      body.sidebar-collapsed .sidebar { width:260px; padding:18px 14px; }
      body.sidebar-collapsed .sidebar-brand-text, body.sidebar-collapsed .sidebar-link-text { display:inline; }
      body.sidebar-collapsed .sidebar a { text-align:left; padding:11px 12px; }
      body.sidebar-collapsed .sidebar a i { width:24px; }
      .sidebar-backdrop { position:fixed; inset:0; background:rgba(10,20,40,.4); z-index:1030; }
      body.mobile-menu-open .sidebar-backdrop { display:block; }
      .main, body.sidebar-collapsed .main { margin-left:0 !important; padding:14px; }
    }

    .sidebar h4 {
      font-weight: bold;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 11px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      transition: 0.3s;
      font-size: 15px;
    }

    .sidebar a:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .sidebar .logout {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.12);
    }

    .main { margin-left:260px; padding:20px; min-width:0; transition:margin-left .25s ease; }

    .card {
      border-radius: 12px;
      border: none;
    }

    .topbar {
      background: white;
      padding: 12px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-box {
      display: none;
    }
  </style>
</head>

<body class="sidebar-collapsed">

  <div class="sidebar">
    <div class="sidebar-brand"><span class="sidebar-brand-icon"><i class="bi bi-shield-lock"></i></span><h4 class="sidebar-brand-text mb-0">Sistema</h4></div>
    <hr>

    <a href="#" title="Inicio" onclick="mostrarInicio()"><i class="bi bi-house"></i><span class="sidebar-link-text">Inicio</span></a>

    <div id="menuOpciones"></div>

    <a href="#" title="Cerrar sesión" class="logout" onclick="logout()"><i class="bi bi-box-arrow-left"></i><span class="sidebar-link-text">Cerrar sesión</span></a>
  </div>

  <div class="sidebar-backdrop" onclick="cerrarMenuMovil()"></div>
  <div class="main">
    <div class="topbar gap-3">
      <div class="d-flex align-items-center gap-3">
        <button id="btnToggleMenu" class="sidebar-toggle" type="button" onclick="alternarMenuLateral()" aria-label="Expandir menú" aria-expanded="false" title="Expandir menú"><i class="bi bi-layout-sidebar"></i></button>
        <h5 id="tituloSeccion" class="mb-0">Dashboard</h5>
      </div>
      <div id="userName" class="text-muted small"></div>
    </div>

    <div id="inicio" class="section-box">
      <div class="row">

        <div class="col-md-4">
          <div class="card shadow p-3">
            <h6>Total Estudiantes</h6>
            <h3 id="totalEstudiantes">Cargando...</h3>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card shadow p-3">
            <h6>Salidas Hoy</h6>
            <h3 id="salidasHoy">Cargando...</h3>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card shadow p-3">
            <h6>Pendientes</h6>
            <h3 id="pendientes">Cargando...</h3>
          </div>
        </div>

      </div>

      <div class="card shadow mt-4 p-3">
        <h5>Actividad reciente</h5>

        <table class="table">
          <thead>
            <tr>
              <th>Estudiante</th>
              <th>Tipo</th>
              <th>Hora</th>
            </tr>
          </thead>
          <tbody id="actividadReciente">
            <tr>
              <td colspan="3" class="text-center text-muted py-4">
                Cargando actividad reciente...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="contenidoDinamico"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let estudiantesLowerData = [];
    let estudiantesMiddleData = [];
    let estudiantesHighData = [];

    const usuario = JSON.parse(localStorage.getItem("usuario"));

    if (!usuario) {
      window.location.href = "/";
    }

    document.getElementById("userName").innerText = "👤 " + usuario.nombre;

    function alternarMenuLateral() {
      if (window.matchMedia("(max-width: 768px)").matches) {
        const abierto = document.body.classList.toggle("mobile-menu-open");
        const boton = document.getElementById("btnToggleMenu");
        if (boton) {
          boton.setAttribute("aria-expanded", String(abierto));
          boton.setAttribute("aria-label", abierto ? "Cerrar menú" : "Abrir menú");
          boton.title = abierto ? "Cerrar menú" : "Abrir menú";
          boton.innerHTML = abierto ? '<i class="bi bi-x-lg"></i>' : '<i class="bi bi-layout-sidebar-inset"></i>';
        }
        return;
      }
      const contraido = document.body.classList.toggle("sidebar-collapsed");
      const boton = document.getElementById("btnToggleMenu");
      if (boton) {
        boton.setAttribute("aria-expanded", String(!contraido));
        boton.setAttribute("aria-label", contraido ? "Expandir menú" : "Contraer menú");
        boton.title = contraido ? "Expandir menú" : "Contraer menú";
        boton.innerHTML = contraido ? '<i class="bi bi-layout-sidebar"></i>' : '<i class="bi bi-layout-sidebar-inset"></i>';
      }
    }

    function cerrarMenuMovil() {
      document.body.classList.remove("mobile-menu-open");
      if (window.matchMedia("(max-width: 768px)").matches) {
        const boton = document.getElementById("btnToggleMenu");
        if (boton) {
          boton.setAttribute("aria-expanded", "false");
          boton.setAttribute("aria-label", "Abrir menú");
          boton.title = "Abrir menú";
          boton.innerHTML = '<i class="bi bi-layout-sidebar-inset"></i>';
        }
      }
    }

    const permisos = usuario.permisos_menu || [];
    const menu = document.getElementById("menuOpciones");

    const opciones = [
      {
        permiso: "salida_lower",
        texto: "Salida Lower School",
        icono: "bi-door-open"
      },
      {
        permiso: "salida_middle",
        texto: "Salida Middle School",
        icono: "bi-door-open"
      },
      {
        permiso: "salida_high",
        texto: "Salida High School",
        icono: "bi-door-open"
      },
      {
        permiso: "importar_data",
        texto: "Importar Data",
        icono: "bi-cloud-upload"
      },
      {
        permiso: "reporte_salidas",
        texto: "Reporte de Salidas",
        icono: "bi-file-earmark-text"
      },
      {
        permiso: "dashboard_salidas",
        texto: "Dashboard de Salidas",
        icono: "bi-speedometer2"
      }

    ];

    opciones.forEach(op => {
      if (permisos.includes(op.permiso)) {
        menu.innerHTML += `
          <a href="#" onclick="cargarVista('${op.permiso}')">
            <i class="bi ${op.icono}"></i><span class="sidebar-link-text">${op.texto}</span>
          </a>
        `;
      }
    });

    function ocultarSecciones() {
      document.querySelectorAll(".section-box").forEach(sec => {
        sec.style.display = "none";
      });

      document.getElementById("contenidoDinamico").innerHTML = "";
    }

    async function cargarDatosDashboard() {
      try {
        // Cargar total estudiantes
        const resTotal = await fetch("/api/estudiantes/total");
        const dataTotal = await resTotal.json();
        document.getElementById("totalEstudiantes").innerText = dataTotal.ok ? dataTotal.data : "Error";

        // Cargar salidas hoy
        const resHoy = await fetch("/api/salidas/hoy");
        const dataHoy = await resHoy.json();
        document.getElementById("salidasHoy").innerText = dataHoy.ok ? dataHoy.data : "Error";

        // Cargar pendientes
        const resPend = await fetch("/api/salidas/pendientes");
        const dataPend = await resPend.json();
        document.getElementById("pendientes").innerText = dataPend.ok ? dataPend.data : "Error";

        // Cargar actividad reciente
        const resAct = await fetch("/api/salidas/actividad");
        const dataAct = await resAct.json();
        
        const tbody = document.getElementById("actividadReciente");
        if (dataAct.ok && dataAct.data.length > 0) {
          tbody.innerHTML = "";
          dataAct.data.forEach(item => {
            const badgeClass = item.tipo === "BUS" ? "bg-primary" : "bg-success";
            tbody.innerHTML += `
              <tr>
                <td>${item.estudiante}</td>
                <td><span class="badge ${badgeClass}">${item.tipo}</span></td>
                <td>${item.hora}</td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = `
            <tr>
              <td colspan="3" class="text-center text-muted py-4">
                No hay actividad reciente
              </td>
            </tr>
          `;
        }

      } catch (error) {
        console.error("Error cargando datos del dashboard:", error);
        document.getElementById("totalEstudiantes").innerText = "Error";
        document.getElementById("salidasHoy").innerText = "Error";
        document.getElementById("pendientes").innerText = "Error";
        document.getElementById("actividadReciente").innerHTML = `
          <tr>
            <td colspan="3" class="text-center text-danger py-4">
              Error cargando actividad reciente
            </td>
          </tr>
        `;
      }
    }

    function mostrarInicio() {
      cerrarMenuMovil();
      ocultarSecciones();
      document.getElementById("inicio").style.display = "block";
      document.getElementById("tituloSeccion").innerText = "Dashboard";
      cargarDatosDashboard();
    }

    function cargarVista(vista) {
      cerrarMenuMovil();
      ocultarSecciones();

      fetch(`/views/${vista}.html`)
        .then(res => {
          if (!res.ok) throw new Error("No se pudo cargar la vista: " + vista);
          return res.text();
        })
        .then(html => {
          document.getElementById("contenidoDinamico").innerHTML = html;

          const titulos = {
            salida_lower: "Salida Lower School",
            salida_middle: "Salida Middle School",
            salida_high: "Salida High School",
            importar_data: "Importar Data",
            reporte_salidas: "Reporte de Salidas",
            dashboard_salidas: "Dashboard de Salidas"
          };

          document.getElementById("tituloSeccion").innerText = titulos[vista] || "Dashboard";

          if (vista === "salida_lower") {
            inicializarLower();
          }
          if (vista === "salida_middle") {
            inicializarMiddle();
          }
          if (vista === "salida_high") {
            inicializarHigh();
          }
          if (vista === "dashboard_salidas") {
            inicializarDashboardSalidas();
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById("contenidoDinamico").innerHTML =
            `<div class="alert alert-danger">Error cargando módulo</div>`;
        });
    }

    let eventosDashboardHik = [];
    let eventosFiltradosDashboardHik = [];

    async function inicializarDashboardSalidas() {
      const modo = document.getElementById("dsModoFecha");
      const inicio = document.getElementById("dsFechaInicio");
      const fin = document.getElementById("dsFechaFin");
      const hoy = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Guayaquil", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
      if (inicio && !inicio.value) inicio.value = hoy;
      if (fin && !fin.value) fin.value = hoy;
      const fechaResumen = document.getElementById("dsFechaResumen");
      if (fechaResumen && !fechaResumen.value) fechaResumen.value = hoy;
      if (modo) modo.onchange = () => {
        const rango = document.getElementById("dsRangoFechas");
        if (rango) {
          rango.classList.toggle("d-none", modo.value !== "rango");
          rango.classList.toggle("d-flex", modo.value === "rango");
        }
      };
      await cargarConfiguracionHorariosHik();
      await cargarHistorialDiarioHik();
      await cargarNivelesEstudiantesHik();
      await cargarPuertasDashboardHik();
      const selectorPuertas = document.getElementById("dsPuertas");
      if (selectorPuertas && selectorPuertas.options.length > 0 && selectorPuertas.options[0].value) {
        await cargarDashboardEventosHik();
      }
    }

    function horaTextoHik(valor) {
      if (!valor) return "No identificada";
      return String(valor).slice(0, 5);
    }

    async function cargarNivelesEstudiantesHik() {
      const cuerpo = document.getElementById("dsTablaNiveles");
      const estado = document.getElementById("dsEstadoNiveles");
      if (!cuerpo || !estado) return;
      estado.textContent = "Consultando asignaciones guardadas...";
      try {
        const response = await fetch("/api/salidas/dashboard-niveles-estudiantes", { headers: { Accept: "application/json" } });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.message || "No se pudieron consultar los niveles.");
        const rows = Array.isArray(result.data) ? result.data : [];
        cuerpo.replaceChildren();
        if (!rows.length) {
          cuerpo.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-3">No hay asignaciones sincronizadas. Pulsa «Sincronizar desde HikCentral».</td></tr>';
          estado.textContent = "No hay asignaciones guardadas en Supabase.";
          return;
        }
        rows.forEach(row => {
          const tr = document.createElement("tr");
          const curso = [row.curso, row.paralelo ? "Paralelo " + row.paralelo : ""].filter(Boolean).join(" · ");
          const horario = row.hora_inicio_configurada && row.hora_fin_configurada
            ? horaTextoHik(row.hora_inicio_configurada) + "–" + horaTextoHik(row.hora_fin_configurada)
            : "Pendiente de verificar";
          const valores = [
            row.estudiante || "Sin nombre",
            row.codigo || row.codigo_hik || "—",
            curso || row.seccion || "—",
            row.nivel_acceso || "Sin nivel",
            row.horario_hikcentral_nombre || "Sin plantilla identificada",
            row.hora_salida_nivel ? horaTextoHik(row.hora_salida_nivel) : "No indicada por la API",
            horario,
            row.fuente_horario || "Por verificar"
          ];
          valores.forEach((valor, index) => {
            const td = document.createElement("td");
            td.textContent = String(valor);
            if (index === 3) td.style.minWidth = "230px";
            tr.append(td);
          });
          cuerpo.append(tr);
        });
        estado.textContent = rows.length + " asignaciones estudiante/nivel guardadas. La plantilla de HikCentral se muestra por separado del horario escolar configurado." ;
      } catch (error) {
        estado.textContent = error.message || "Error consultando asignaciones.";
        estado.className = "small text-danger mb-2";
      }
    }

    async function sincronizarNivelesEstudiantesHik() {
      const boton = document.getElementById("dsBtnSincronizarNiveles");
      const estado = document.getElementById("dsEstadoNiveles");
      if (!boton || !estado) return;
      boton.disabled = true;
      boton.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Sincronizando...';
      estado.className = "small text-muted mb-2";
      estado.textContent = "Consultando niveles, estudiantes asignados y detalles de personas en HikCentral. Puede tardar un poco...";
      try {
        const response = await fetch("/api/salidas/dashboard-niveles/sincronizar", {
          method: "POST",
          headers: { Accept: "application/json", "Content-Type": "application/json" },
          body: JSON.stringify({})
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.message || "No se pudo sincronizar HikCentral.");
        const d = result.data || {};
        estado.textContent = "Sincronización terminada: " + (d.nivelesSincronizados || 0) + " niveles; " + (d.asignacionesSincronizadas || 0) + " asignaciones vinculadas; " + (d.personasSinCoincidencia || 0) + " personas sin coincidencia con Supabase; " + (d.horariosDetectadosDesdeNombreDescripcion || 0) + " horarios identificados directamente en la API.";
        if (Number.isFinite(Number(d.referenciasHorarioHikCentral))) estado.textContent += " Referencias de horario devueltas por los niveles: " + d.referenciasHorarioHikCentral + ".";
        await cargarNivelesEstudiantesHik();
        await cargarHistorialDiarioHik();
      } catch (error) {
        estado.className = "small text-danger mb-2";
        estado.textContent = error.message || "Error al sincronizar niveles de acceso.";
      } finally {
        boton.disabled = false;
        boton.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i> Sincronizar desde HikCentral';
      }
    }

    async function cargarResumenDiarioSalidasHik() {
      const cuerpo = document.getElementById("dsTablaResumenDiario");
      const estado = document.getElementById("dsResumenEstado");
      const indicadores = document.getElementById("dsResumenIndicadores");
      const fecha = document.getElementById("dsFechaResumen")?.value || "";
      if (!cuerpo || !estado || !indicadores) return;
      if (!fecha) {
        estado.textContent = "Selecciona una fecha para generar el control.";
        return;
      }
      estado.className = "small text-muted mb-2";
      estado.textContent = "Calculando el control diario desde el histórico de Supabase...";
      cuerpo.innerHTML = '<tr><td colspan="8" class="text-center py-3"><span class="spinner-border spinner-border-sm me-2"></span>Calculando...</td></tr>';
      try {
        const response = await fetch("/api/salidas/dashboard-resumen-diario?fecha=" + encodeURIComponent(fecha), { headers: { Accept: "application/json" } });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.message || "No se pudo generar el control diario.");
        const rows = Array.isArray(result.data) ? result.data : [];
        indicadores.innerHTML = "";
        [
          ["Estudiantes activos", result.totalEstudiantes || 0],
          ["Salidas registradas", result.conSalida || 0],
          ["Novedades", result.novedades || 0],
          ["Sin nivel sincronizado", result.sinNivel || 0]
        ].forEach(([label, value]) => {
          const col = document.createElement("div");
          col.className = "col-6 col-lg-3";
          const card = document.createElement("div");
          card.className = "border rounded p-3 h-100";
          const titulo = document.createElement("div");
          titulo.className = "small text-muted";
          titulo.textContent = label;
          const numero = document.createElement("div");
          numero.className = "fs-4 fw-semibold";
          numero.textContent = String(value);
          card.append(titulo, numero);
          col.append(card);
          indicadores.append(col);
        });
        cuerpo.replaceChildren();
        if (!rows.length) {
          cuerpo.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-3">No hay estudiantes para esta fecha.</td></tr>';
        } else {
          rows.forEach(row => {
            const tr = document.createElement("tr");
            const valores = [
              row.estudiante || "Sin nombre",
              row.codigo || row.codigo_hik || "—",
              [row.curso, row.paralelo ? "Paralelo " + row.paralelo : ""].filter(Boolean).join(" · ") || "—",
              (row.niveles || []).join(", ") || "Sin nivel asignado",
              row.hora_esperada || "Por verificar",
              row.hora_real_salida || "—",
              row.puerta_salida || "—"
            ];
            valores.forEach(valor => {
              const td = document.createElement("td");
              td.textContent = String(valor);
              tr.append(td);
            });
            const tdEstado = document.createElement("td");
            const badge = document.createElement("span");
            const estadoFila = String(row.estado || "Por verificar");
            badge.className = "badge " + (
              estadoFila === "Salida registrada en horario" ? "text-bg-success" :
              estadoFila === "Pendiente de salida" ? "text-bg-secondary" :
              estadoFila === "Nivel de acceso no sincronizado" || estadoFila === "Horario por verificar" ? "text-bg-warning" :
              "text-bg-danger"
            );
            badge.textContent = estadoFila;
            tdEstado.append(badge);
            tr.append(tdEstado);
            cuerpo.append(tr);
          });
        }
        estado.textContent = "Control del " + result.fecha + ": " + (result.totalEstudiantes || 0) + " estudiantes. Los horarios de la configuración escolar son ventanas de control; cuando HikCentral entregue una hora exacta se mostrará por separado.";
      } catch (error) {
        cuerpo.innerHTML = '<tr><td colspan="8" class="text-center text-danger py-3"></td></tr>';
        cuerpo.querySelector("td").textContent = error.message || "Error calculando el control diario.";
        estado.className = "small text-danger mb-2";
        estado.textContent = error.message || "Error calculando el control diario.";
      }
    }

    async function cargarConfiguracionHorariosHik() {
      const contenedor = document.getElementById("dsConfiguracionHorarios");
      if (!contenedor) return;
      try {
        const response = await fetch("/api/salidas/dashboard-configuracion", { headers: { Accept: "application/json" } });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.message || "No se pudieron cargar los horarios.");
        const configuraciones = Array.isArray(result.data) ? result.data : [];
        contenedor.replaceChildren();
        if (!configuraciones.length) {
          contenedor.innerHTML = '<div class="col-12 text-muted small">No hay horarios activos configurados.</div>';
          return;
        }
        configuraciones.forEach(item => {

      if (modo === "rango" && (!inicio || !fin || inicio > fin)) {

    function campoEventoHik(evento, campos) {
      for (const campo of campos) {
        const valor = campo.split(".").reduce((obj, key) => obj && obj[key] !== undefined ? obj[key] : undefined, evento);
        if (valor !== undefined && valor !== null && valor !== "") return valor;
      }
      return "";
    }

    function clasificarEventoDashboardHik(evento) {
      const texto = [
        campoEventoHik(evento, ["eventName", "eventTypeName", "eventDescription", "eventType", "eventTypeCode"]),
        campoEventoHik(evento, ["eventMinor", "eventMinorName", "eventMajor", "eventMajorName"]),
        campoEventoHik(evento, ["inOrOut", "direction", "cardReaderKind"]),
        campoEventoHik(evento, ["attendanceStatus", "verifyMode", "currentEvent"])
      ].join(" ").toLowerCase();
      const resultado = String(campoEventoHik(evento, ["attendanceStatus", "eventStatus", "status", "result", "checkResult", "eventDescription"])).toLowerCase();
      const concedido = /conced|allow|success|normal|pass|valid/.test(resultado + " " + texto) && !/denied|deny|invalid|fail|error|reject|deneg/.test(resultado + " " + texto);
      const denegado = /denied|deny|invalid|fail|error|reject|deneg|abnormal/.test(resultado + " " + texto);
      const entrada = /entrance|entry|check.?in|entrada|inbound/.test(texto);
      const salida = /exit|leave|check.?out|salida|outbound/.test(texto);
      return { texto, concedido, denegado, entrada, salida };
    }

    function renderTablaEventosHik(eventos) {
      const tabla = document.getElementById("dsTablaEventos");
      tabla.replaceChildren();
      if (!eventos.length) {
        const fila = document.createElement("tr"); const celda = document.createElement("td");
        celda.colSpan = 6; celda.className = "text-center text-muted py-4"; celda.textContent = "No hay eventos para mostrar.";
        fila.append(celda); tabla.append(fila); return;
      }
      eventos.forEach(evento => {
        const fila = document.createElement("tr");
        const persona = campoEventoHik(evento, ["personName", "name", "employeeName", "personInfo.personName", "person.name"]) || [campoEventoHik(evento, ["personGivenName", "personInfo.personGivenName"]), campoEventoHik(evento, ["personFamilyName", "personInfo.personFamilyName"])].filter(Boolean).join(" ");
        const codigo = campoEventoHik(evento, ["studentHikCode", "personCode", "employeeNo", "employeeNoString", "personId", "cardNo", "certificateNo", "studentCode"]);
        const fecha = campoEventoHik(evento, ["eventTime", "SwipeTime", "swipeTime", "time", "eventDate", "dateTime", "occurTime"]);
        const puerta = campoEventoHik(evento, ["doorName", "devName", "doorNo", "doorIndexCode", "readerName", "srcName", "deviceName"]);
        const tipo = campoEventoHik(evento, ["eventName", "eventTypeName", "eventDescription", "eventType", "eventMinorName"]);
        const resultado = campoEventoHik(evento, ["attendanceStatus", "eventStatus", "status", "result", "checkResult", "eventDescription"]);
        [persona || "Nombre no incluido en el evento", codigo, fecha, puerta, tipo, resultado].forEach(valor => {
          const celda = document.createElement("td"); celda.textContent = String(valor || "—"); fila.append(celda);
        });
        tabla.append(fila);
      });
    }

    function filtrarTablaEventosHik() {
      const texto = (document.getElementById("dsBuscarEvento")?.value || "").toLowerCase().trim();
      eventosFiltradosDashboardHik = eventosDashboardHik.filter(evento => JSON.stringify(evento).toLowerCase().includes(texto));
      renderTablaEventosHik(eventosFiltradosDashboardHik);
    }

    async function registrarSalida(tipo) {
  const motivo = document.getElementById("modalMotivo").value;
  const fecha = document.getElementById("modalFecha").value;
  const hora = document.getElementById("modalHora").value;

  if (!estudianteActual || !fecha || !hora) {
    alert("Faltan datos para registrar la salida");
    return;
  }

  const usuario = JSON.parse(localStorage.getItem("usuario"));

  const payload = {
    estudiante_id: estudianteActual,
    usuario_id: usuario?.id || null,
    tipo_salida: tipo,
    fecha: fecha,
    hora: hora,
    motivo: motivo,
    nivel: "lower"
  };

  try {
    const res = await fetch("/api/salidas", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!data.ok) {
      throw new Error(data.message || "Error registrando salida");
    }

    alert("Salida registrada correctamente");

    const modalElement = document.getElementById("modalSalida");
    const modal = bootstrap.Modal.getInstance(modalElement);

    if (modal) {
      modal.hide();
    }

  } catch (error) {
    console.error(error);
    alert(error.message);
  }
}

          estadoImportacion.innerText = archivo ? "Listo para importar" : "Pendiente";
          estadoImportacion.className = archivo ? "fw-semibold text-primary" : "fw-semibold text-secondary";
        }
      }
    });

    function importarCSV() {
      const input = document.getElementById("archivoCSV");
      const resultado = document.getElementById("resultadoImportacion");
      const estadoImportacion = document.getElementById("estadoImportacion");

      if (!input || !input.files.length) {
        resultado.innerHTML = `
          <div class="alert alert-warning border-0 shadow-sm">
            <i class="bi bi-exclamation-triangle me-2"></i>
            Seleccione un archivo CSV antes de importar.
          </div>
        `;
        return;
      }

      const archivo = input.files[0];

      const formData = new FormData();
      formData.append("archivo", archivo);
      formData.append("usuario_id", usuario.id || "");

      resultado.innerHTML = `
        <div class="alert alert-info border-0 shadow-sm">
          <i class="bi bi-hourglass-split me-2"></i>
          Importando archivo, por favor espere...
        </div>
      `;

      if (estadoImportacion) {
        estadoImportacion.innerText = "Importando...";
        estadoImportacion.className = "fw-semibold text-info";
      }

      fetch("/api/importaciones/estudiantes", {
        method: "POST",
        body: formData
      })
        .then(res => res.json())
        .then(data => {
          if (!data.ok) {
            throw new Error(data.message || "Error al importar");
          }

          resultado.innerHTML = `
            <div class="alert alert-success border-0 shadow-sm">
              <i class="bi bi-check-circle me-2"></i>
              Importación finalizada correctamente.
            </div>
          `;

          if (estadoImportacion) {
            estadoImportacion.innerText = "Importado";
            estadoImportacion.className = "fw-semibold text-success";
          }
        })
        .catch(err => {
          console.error(err);

          resultado.innerHTML = `
            <div class="alert alert-danger border-0 shadow-sm">
              <i class="bi bi-x-circle me-2"></i>
              ${err.message}
            </div>
          `;

          if (estadoImportacion) {
            estadoImportacion.innerText = "Error";
            estadoImportacion.className = "fw-semibold text-danger";
          }
        });
    }

    function logout() {
      localStorage.removeItem("usuario");
      window.location.href = "/";
    }

    mostrarInicio();

async function buscarReporteSalidas() {
  const fechaInicio = document.getElementById("fechaInicioReporte").value;
  const fechaFin = document.getElementById("fechaFinReporte").value;
  const mensaje = document.getElementById("mensajeReporte");
  const tabla = document.getElementById("tablaReporteSalidas");

  mensaje.innerHTML = "";

  if (!fechaInicio || !fechaFin) {
    mensaje.innerHTML = `
      <div class="alert alert-warning border-0 shadow-sm">
        <i class="bi bi-exclamation-triangle me-2"></i>
        Seleccione ambas fechas para buscar.
      </div>
    `;
    return;
  }

  if (fechaInicio > fechaFin) {
    mensaje.innerHTML = `
      <div class="alert alert-warning border-0 shadow-sm">
        <i class="bi bi-exclamation-triangle me-2"></i>
        La fecha de inicio no puede ser mayor a la fecha fin.
      </div>
    `;
    return;
  }

  tabla.innerHTML = `
    <tr>
      <td colspan="8" class="text-center text-muted py-4">
        <div class="spinner-border spinner-border-sm me-2" role="status"></div>
        Cargando reporte...
      </td>
    </tr>
  `;

  try {
    const response = await fetch(`/api/salidas/reporte?fecha_inicio=${fechaInicio}&fecha_fin=${fechaFin}`);
    const data = await response.json();

    if (!data.ok) {
      throw new Error(data.message || "Error al obtener el reporte");
    }

    renderTablaReporte(data.data);

  } catch (error) {
    console.error("Error:", error);
    mensaje.innerHTML = `
      <div class="alert alert-danger border-0 shadow-sm">
        <i class="bi bi-x-circle me-2"></i>
        ${error.message}
      </div>
    `;
    tabla.innerHTML = `
      <tr>
        <td colspan="8" class="text-center text-danger py-4">
          Error al cargar el reporte
        </td>
      </tr>
    `;
  }
}

function renderTablaReporte(salidas) {
  const tabla = document.getElementById("tablaReporteSalidas");

  if (!salidas || salidas.length === 0) {
    tabla.innerHTML = `
      <tr>
        <td colspan="8" class="text-center text-muted py-4">
        <i class="bi bi-info-circle me-2"></i>
        No se encontraron salidas en el rango de fechas seleccionado.

  tabla.innerHTML = "";

  salidas.forEach(salida => {
    const tipoBadge = salida.tipo === "BUS" 
      ? '<span class="badge bg-primary">Bus</span>' 
      : '<span class="badge bg-success">PP</span>';

    tabla.innerHTML += `

  });
}

async function descargarPDFReporte() {
  const fechaInicio = document.getElementById("fechaInicioReporte").value;
  const fechaFin = document.getElementById("fechaFinReporte").value;

  if (!fechaInicio || !fechaFin) {
    alert("Seleccione ambas fechas para descargar el reporte.");
    return;
  }

  try {
    const response = await fetch(`/api/salidas/reporte?fecha_inicio=${fechaInicio}&fecha_fin=${fechaFin}`);
    const data = await response.json();

    if (!data.ok || !data.data || data.data.length === 0) {
      alert("No hay datos para descargar en el rango seleccionado.");
      return;
    }

    // Crear PDF usando jsPDF en modo horizontal
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const pageWidth = doc.internal.pageSize.width;
    const pageHeight = doc.internal.pageSize.height;
    const marginLeft = 15;
    const marginRight = 15;
    const headerY = 60;
    const lineHeight = 4.5;

    // Título
    doc.setFontSize(18);
    doc.text("Reporte de Salidas", marginLeft, 20);
    
    doc.setFontSize(12);
    doc.text(`Periodo: ${fechaInicio} - ${fechaFin}`, marginLeft, 35);
    doc.text(`Total de salidas: ${data.data.length}`, marginLeft, 45);

    const columns = [
      { label: 'Fecha', key: 'fecha', x: marginLeft, width: 18 },
      { label: 'Hora', key: 'hora', x: 38, width: 14 },
      { label: 'Estudiante', key: 'estudiante', x: 55, width: 68 },
      { label: 'Curso', key: 'curso', x: 126, width: 16 },
      { label: 'Paralelo', key: 'paralelo', x: 144, width: 16 },
      { label: 'Tipo', key: 'tipo', x: 162, width: 18 },
      { label: 'Motivo', key: 'motivo', x: 180, width: 70 },
      { label: 'Registrado por', key: 'registrado_por', x: 255, width: pageWidth - 255 - marginRight }
    ];

    function printTableHeader(currentY) {
      doc.setFontSize(10);
      columns.forEach(col => {
        doc.text(col.label, col.x, currentY);
      });
      doc.setLineWidth(0.2);
      doc.line(marginLeft, currentY + 2, pageWidth - marginRight, currentY + 2);
      doc.setFontSize(8);
      return currentY + 8;
    }

    let y = printTableHeader(headerY);

    data.data.forEach(salida => {
      const rowValues = columns.map(col => {
        const value = salida[col.key] != null ? salida[col.key].toString() : '';
        return doc.splitTextToSize(value, col.width);
      });

      const rowHeight = Math.max(...rowValues.map(lines => lines.length)) * lineHeight;

      if (y + rowHeight > pageHeight - 20) {
        doc.addPage();
        y = printTableHeader(20);
      }

      rowValues.forEach((lines, index) => {
        const col = columns[index];
        doc.text(lines, col.x, y);
      });

      y += rowHeight + 2;
    });

    // Pie de página
    const fechaGeneracion = new Date().toLocaleDateString();
    doc.setFontSize(8);
    doc.text(`Generado el: ${fechaGeneracion}`, marginLeft, pageHeight - 10);

    // Descargar
    doc.save(`reporte_salidas_${fechaInicio}_${fechaFin}.pdf`);

  } catch (error) {
    console.error("Error al descargar PDF:", error);
    alert("Error al generar el PDF.");
  }
}

    let historialDiarioHik = [];

    function fechaLocalHikDashboard(fecha = new Date()) {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Guayaquil", year: "numeric", month: "2-digit", day: "2-digit"
      }).format(fecha);
    }

    function fechaHoraLocalHikDashboard(valor) {
      if (!valor) return "—";
      const fecha = new Date(valor);
      if (Number.isNaN(fecha.getTime())) return String(valor);
      return new Intl.DateTimeFormat("es-EC", {
        timeZone: "America/Guayaquil", day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit", hourCycle: "h23"
      }).format(fecha);
    }

    async function cargarHistorialDiarioHik() {
      const cuerpo = document.getElementById("dsHistTabla");
      const estado = document.getElementById("dsHistEstado");
      const indicadores = document.getElementById("dsHistIndicadores");
      const desde = document.getElementById("dsHistDesde");
      const hasta = document.getElementById("dsHistHasta");
      if (!cuerpo || !estado || !indicadores) return;
      const hoy = fechaLocalHikDashboard();
      if (hasta && !hasta.value) hasta.value = hoy;
      if (desde && !desde.value) {
        const d = new Date();
        d.setDate(d.getDate() - 29);
        desde.value = fechaLocalHikDashboard(d);
      }
      const fechaDesde = desde?.value || "";
      const fechaHasta = hasta?.value || hoy;
      if (!fechaDesde || !fechaHasta || fechaDesde > fechaHasta) {
        estado.className = "small text-danger mb-2";
        estado.textContent = "Selecciona un rango de fechas válido.";
        return;
      }
      estado.className = "small text-muted mb-2";
      estado.textContent = "Consultando el histórico guardado en Supabase...";
      cuerpo.innerHTML = '<tr><td colspan="8" class="text-center py-4"><span class="spinner-border spinner-border-sm me-2"></span>Consultando...</td></tr>';
      try {
        const response = await fetch("/api/salidas/dashboard-historial?desde=" + encodeURIComponent(fechaDesde) + "&hasta=" + encodeURIComponent(fechaHasta), {
          headers: { Accept: "application/json" }
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.message || "No se pudo consultar el histórico.");
        historialDiarioHik = Array.isArray(result.data) ? result.data : [];
        indicadores.replaceChildren();
        const totales = [
          ["Días con registro", historialDiarioHik.length],
          ["Último total de niveles", historialDiarioHik[0]?.total_niveles ?? 0],
          ["Últimas asignaciones", historialDiarioHik[0]?.total_asignaciones ?? 0],
          ["Reglas guardadas", historialDiarioHik[0]?.total_reglas ?? 0]
        ];
        totales.forEach(([label, value]) => {
          const col = document.createElement("div");
          col.className = "col-6 col-lg-3";
          const card = document.createElement("div");
          card.className = "border rounded-3 p-3 h-100 bg-light";
          const caption = document.createElement("div");
          caption.className = "small text-muted";
          caption.textContent = label;
          const number = document.createElement("div");
          number.className = "fs-4 fw-semibold";
          number.textContent = String(value);
          card.append(caption, number);
          col.append(card);
          indicadores.append(col);
        });
        cuerpo.replaceChildren();
        if (!historialDiarioHik.length) {
          cuerpo.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4"><i class="bi bi-database-exclamation fs-4 d-block mb-2"></i>No hay fotografías guardadas en este periodo.</td></tr>';
          estado.textContent = "No se encontraron sincronizaciones entre " + fechaDesde + " y " + fechaHasta + ".";
          return;
        }
        historialDiarioHik.forEach((fila, index) => {
          const tr = document.createElement("tr");
          const celdas = [
            fila.fecha || "—",
            fechaHoraLocalHikDashboard(fila.sincronizado_en),
            fila.total_niveles ?? 0,
            fila.total_asignaciones ?? 0,
            fila.total_horarios ?? 0,
            fila.total_reglas ?? 0
          ];
          celdas.forEach((valor, i) => {
            const td = document.createElement("td");
            td.textContent = String(valor);
            if (i === 0) td.className = "fw-semibold text-nowrap";
            tr.append(td);
          });
          const cambio = document.createElement("td");
          if (fila.variacion_niveles === null || fila.variacion_niveles === undefined) {
            cambio.textContent = "Sin día anterior en el rango";
            cambio.className = "small text-muted";
          } else {
            const nivelDiff = Number(fila.variacion_niveles);
            const asigDiff = Number(fila.variacion_asignaciones || 0);
            cambio.textContent = "Niveles " + (nivelDiff > 0 ? "+" : "") + nivelDiff + " · Asignaciones " + (asigDiff > 0 ? "+" : "") + asigDiff;
            cambio.className = "small " + (nivelDiff < 0 || asigDiff < 0 ? "text-danger" : nivelDiff > 0 || asigDiff > 0 ? "text-success" : "text-muted");
          }
          tr.append(cambio);
          const detalleCell = document.createElement("td");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn btn-sm btn-outline-primary";
          btn.innerHTML = '<i class="bi bi-list-ul me-1"></i>Ver detalle';
          btn.setAttribute("aria-expanded", "false");
          const detailId = "dsHistDetalle" + index;
          btn.setAttribute("aria-controls", detailId);
          btn.onclick = () => {
            const detailRow = document.getElementById(detailId);
            if (!detailRow) return;
            const visible = !detailRow.classList.contains("d-none");
            detailRow.classList.toggle("d-none", visible);
            btn.setAttribute("aria-expanded", String(!visible));
            btn.innerHTML = visible ? '<i class="bi bi-list-ul me-1"></i>Ver detalle' : '<i class="bi bi-chevron-up me-1"></i>Ocultar';
          };
          detalleCell.append(btn);
          tr.append(detalleCell);
          cuerpo.append(tr);

          const detailRow = document.createElement("tr");
          detailRow.id = detailId;
          detailRow.className = "d-none";
          const detailCell = document.createElement("td");
          detailCell.colSpan = 8;
          detailCell.className = "bg-light p-3";
          const grid = document.createElement("div");
          grid.className = "row g-3";
          const sections = [
            ["Niveles de acceso", fila.detalle_niveles || []],
            ["Referencias de horario", fila.referencias_horario || []],
            ["Configuración de salidas", fila.configuracion_salidas || []]
          ];
          sections.forEach(([titulo, data]) => {
            const col = document.createElement("div");
            col.className = "col-12 col-xl-4";
            const h = document.createElement("div");
            h.className = "fw-semibold small mb-2";
            h.textContent = titulo + " (" + data.length + ")";
            const pre = document.createElement("pre");
            pre.className = "small bg-white border rounded p-2 mb-0";
            pre.style.maxHeight = "240px";
            pre.style.overflow = "auto";
            pre.style.whiteSpace = "pre-wrap";
            pre.textContent = data.length ? JSON.stringify(data, null, 2) : "Sin datos";
            col.append(h, pre);
            grid.append(col);
          });
          const asignaciones = document.createElement("div");
          asignaciones.className = "small text-muted mt-2";
          asignaciones.textContent = "Total de asignaciones guardadas: " + (fila.detalle_asignaciones || []).length;
          detailCell.append(grid, asignaciones);
          detailRow.append(detailCell);
          cuerpo.append(detailRow);
        });
        estado.textContent = "Se encontraron " + historialDiarioHik.length + " fotografías diarias. Las variaciones se comparan con el día anterior cuando también está incluido en el periodo.";
      } catch (error) {
        estado.className = "small text-danger mb-2";
        estado.textContent = error.message || "Error consultando histórico diario.";
        cuerpo.innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4">No se pudo cargar el histórico.</td></tr>';
      }
    }
  </script>
