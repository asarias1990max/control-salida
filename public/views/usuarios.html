<div class="card p-3 p-md-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div><h4 class="fw-bold mb-1"><i class="bi bi-people"></i> Usuarios y permisos</h4><small class="text-muted">Autoriza quién puede ingresar y qué módulos puede utilizar.</small></div>
    <button class="btn btn-primary" onclick="abrirFormularioUsuario()"><i class="bi bi-person-plus me-1"></i> Nuevo usuario</button>
  </div>
  <div class="row g-2 mb-3">
    <div class="col-md-8"><input id="usuariosBuscar" class="form-control" placeholder="Buscar por nombre o correo..." oninput="filtrarUsuarios()"></div>
    <div class="col-md-4"><select id="usuariosEstadoFiltro" class="form-select" onchange="filtrarUsuarios()"><option value="">Todos los estados</option><option value="activo">Activos</option><option value="inactivo">Inactivos</option></select></div>
  </div>
  <div id="usuariosMensaje" class="mb-3"></div>
  <div class="table-responsive"><table class="table align-middle">
    <thead><tr><th>Usuario</th><th>Perfil</th><th>Permisos</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
    <tbody id="usuariosTabla"><tr><td colspan="5" class="text-center text-muted py-4">Cargando usuarios...</td></tr></tbody>
  </table></div>
</div>
<div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
 <div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content">
  <div class="modal-header"><div><h5 class="modal-title fw-bold" id="usuarioModalTitulo">Nuevo usuario</h5><small class="text-muted">El usuario ingresará con su cuenta institucional de Google.</small></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
   <input type="hidden" id="usuarioId">
   <div class="row g-3">
    <div class="col-md-6"><label class="form-label fw-semibold">Nombre completo</label><input id="usuarioNombre" class="form-control" maxlength="120" placeholder="Nombre y apellido"></div>
    <div class="col-md-6"><label class="form-label fw-semibold">Correo institucional</label><input id="usuarioEmail" type="email" class="form-control" placeholder="usuario@einstein.k12.ec"></div>
    <div class="col-12"><label class="form-label fw-semibold">Perfil de acceso</label><select id="usuarioRol" class="form-select" onchange="cambiarPerfilUsuario()"><option value="admin">Administrador</option><option value="dashboard_salidas">Dashboard de Salidas</option><option value="operador_salidas">Operador de Salidas</option><option value="personalizado">Personalizado</option></select></div>
    <div class="col-12" id="usuarioPermisosWrap"><label class="form-label fw-semibold mb-2">Permisos de módulos</label><div class="row g-2" id="usuarioPermisos">
      <div class="col-md-6"><label class="form-check border rounded-3 p-3 ps-5"><input class="form-check-input" type="checkbox" value="salida_lower"> Salida Lower School</label></div>
      <div class="col-md-6"><label class="form-check border rounded-3 p-3 ps-5"><input class="form-check-input" type="checkbox" value="salida_middle"> Salida Middle School</label></div>
      <div class="col-md-6"><label class="form-check border rounded-3 p-3 ps-5"><input class="form-check-input" type="checkbox" value="salida_high"> Salida High School</label></div>
      <div class="col-md-6"><label class="form-check border rounded-3 p-3 ps-5"><input class="form-check-input" type="checkbox" value="importar_data"> Importar Data</label></div>
      <div class="col-md-6"><label class="form-check border rounded-3 p-3 ps-5"><input class="form-check-input" type="checkbox" value="reporte_salidas"> Reporte de Salidas</label></div>
      <div class="col-md-6"><label class="form-check border rounded-3 p-3 ps-5"><input class="form-check-input" type="checkbox" value="dashboard_salidas"> Dashboard de Salidas</label></div>
      <div class="col-md-6"><label class="form-check border rounded-3 p-3 ps-5"><input class="form-check-input" type="checkbox" value="usuarios"> Usuarios y permisos <small class="d-block text-muted">Gestionar cuentas y permisos de acceso</small></label></div>
    </div><small class="text-muted">Los perfiles predefinidos asignan sus permisos automáticamente.</small></div>
   </div>
  </div>
  <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" id="usuarioGuardar" onclick="guardarUsuario()"><i class="bi bi-check-lg me-1"></i> Guardar usuario</button></div>
 </div></div>
</div>
