<div class="card border-0 shadow-lg p-4 rounded-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold text-primary mb-0">
        <i class="bi bi-file-earmark-text fs-5 me-2"></i> Reporte de Salidas
      </h4>
      <small class="text-muted">Filtra las salidas por fechas y horario</small>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3">
      <label class="form-label fw-semibold text-muted">Fecha desde</label>
      <input id="fechaInicioReporte" type="date" class="form-control">
    </div>
    <div class="col-6 col-lg-3">
      <label class="form-label fw-semibold text-muted">Fecha hasta</label>
      <input id="fechaFinReporte" type="date" class="form-control">
    </div>
    <div class="col-6 col-lg-2">
      <label class="form-label fw-semibold text-muted">Hora desde (opcional)</label>
      <input id="horaInicioReporte" type="time" class="form-control" value="00:00">
    </div>
    <div class="col-6 col-lg-2">
      <label class="form-label fw-semibold text-muted">Hora hasta (opcional)</label>
      <input id="horaFinReporte" type="time" class="form-control" value="23:59">
    </div>
    <div class="col-6 col-lg-1 d-flex align-items-end">
      <button class="btn btn-primary w-100" onclick="buscarReporteSalidas()" title="Buscar"><i class="bi bi-search"></i></button>
    </div>
    <div class="col-6 col-lg-1 d-flex align-items-end">
      <button class="btn btn-success w-100" onclick="descargarPDFReporte()" title="Descargar PDF"><i class="bi bi-file-earmark-pdf"></i></button>
    </div>
  </div>
  <div class="small text-muted mb-3"><i class="bi bi-info-circle me-1"></i>Las horas se aplican a cada día del rango seleccionado.</div>

  <div id="mensajeReporte"></div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="bg-light">
        <tr class="text-secondary">
          <th>Fecha</th>
          <th>Hora</th>
          <th>Estudiante</th>
          <th>Curso</th>
          <th>Paralelo</th>
          <th>Tipo</th>
          <th>Motivo</th>
          <th>Registrado por</th>
        </tr>
      </thead>

      <tbody id="tablaReporteSalidas">
        <tr>
          <td colspan="8" class="text-center text-muted py-4">
            Seleccione un rango de fechas
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
