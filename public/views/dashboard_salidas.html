<div class="container-fluid py-2">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div>
      <h4 class="mb-1">Dashboard de Salidas</h4>
      <p class="text-muted mb-0">Consulta los registros según los niveles de acceso configurados en HikCentral.</p>
    </div>
    <div class="d-flex align-items-center gap-2">
      <label for="nivelAccesoSalida" class="form-label mb-0 fw-semibold">Nivel de acceso</label>
      <select id="nivelAccesoSalida" class="form-select" style="min-width:260px">
        <option value="">Cargando niveles de HikCentral...</option>
      </select>
      <button type="button" class="btn btn-outline-primary" onclick="inicializarDashboardSalidas()" title="Actualizar niveles de acceso">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
    </div>
  </div>

  <div id="dsMensajeEstado" class="alert alert-info" role="status">
    Consultando niveles de acceso configurados en HikCentral...
  </div>

  <h5 class="mb-3">Información del nivel seleccionado</h5>
  <div id="dsTarjetasNiveles" class="row g-3 mb-4"><div class="col-12"><div class="card shadow-sm"><div class="card-body">Cargando conteos de HikCentral...</div></div></div></div>
  <div id="dsMensajeConteos" class="small text-muted mb-3"></div>
