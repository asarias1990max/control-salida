<div class="container-fluid py-2">
  <div class="mb-3">
    <h4 class="mb-1">DASHBOARD ENTRADAS Y SALIDAS DE ESTUDIANTES</h4>
    <div class="d-flex flex-wrap align-items-end gap-2">
      <div>
        <label for="dsFechaResumen" class="form-label mb-1">Fecha</label>
        <input id="dsFechaResumen" type="date" class="form-control">
      </div>
      <button type="button" class="btn btn-primary" onclick="cargarResumenDiarioSalidasHik()"><i class="bi bi-arrow-clockwise me-1"></i>Consultar</button>
    </div>
  </div>
  <div id="dsResumenEstado" class="small text-muted mb-2" role="status">Consultando eventos de HikCentral...</div>
  <div class="table-responsive mb-4">
    <table class="table table-sm table-bordered table-hover align-middle">
      <thead class="table-light"><tr><th>INDICADOR</th><th>ESTUDIANTES</th><th>TOTAL</th><th class="text-center">%</th></tr></thead>
      <tbody id="dsResumenIndicadores">
        <tr><td colspan="4" class="text-center text-muted py-3">Cargando indicadores...</td></tr>
      </tbody>
    </table>
  </div>
  <div class="d-flex flex-wrap align-items-end gap-2 mb-2">
    <div>
      <label for="dsFiltroIndicador" class="form-label mb-1"><strong>VER LISTADO DE:</strong></label>
      <select id="dsFiltroIndicador" class="form-select" style="min-width:300px;max-width:480px" onchange="filtrarResumenDiarioSalidasHik()">
        <option value="">Selecciona un indicador</option>
      </select>
    </div>
    <div id="dsConteoFiltro" class="small text-muted pb-2"></div>
  </div>
  <div class="table-responsive">
    <table class="table table-sm table-bordered table-hover align-middle">
      <thead class="table-light">
        <tr><th>APELLIDOS</th><th>NOMBRES</th><th>CÓDIGO</th><th>SECCIÓN</th><th>CURSO</th><th>PARALELO</th><th>ENTRADA</th><th>SALIDA</th><th>NIVEL DE ACCESO</th><th>HORARIO PERMITIDO</th><th>PTO ACCESO PERMITIDO</th></tr>
      </thead>
      <tbody id="dsTablaResumenDiario"><tr><td colspan="11" class="text-center text-muted py-3">Selecciona una fecha y consulta.</td></tr></tbody>
    </table>
  </div>
</div>
