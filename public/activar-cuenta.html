<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Activar cuenta | Colegio Einstein</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eaf0fb,#f7f9fd);font-family:Segoe UI, sans-serif}.panel{width:min(94vw,460px);padding:32px;border:1px solid #e1e7f1;border-radius:18px;background:#fff;box-shadow:0 16px 45px #1c37651a}.btn-primary{background:#2449a5;border:0}.muted{color:#718096}</style></head>
<body><main class="panel"><div class="text-center mb-4"><div class="fw-bold text-primary small letter-spacing">COLEGIO EINSTEIN</div><h2 class="fw-bold mt-2">Activa tu cuenta</h2><p class="muted mb-0">Configura tu contraseña para ingresar al sistema.</p></div>
<div id="status" class="alert alert-info">Verificando tu enlace...</div><form id="form" hidden><p class="small muted" id="userInfo"></p>
<label class="form-label fw-semibold" for="password">Nueva contraseña</label><input class="form-control mb-3" id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<label class="form-label fw-semibold" for="confirmacion">Confirma tu contraseña</label><input class="form-control mb-3" id="confirmacion" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<div class="small muted mb-3">Debe tener entre 12 y 128 caracteres.</div><button class="btn btn-primary w-100" id="submit" type="submit">Guardar contraseña</button></form>
<a class="d-block text-center mt-3 small" href="/">Volver al inicio de sesión</a></main>
<script>
const token=new URLSearchParams(location.search).get("token");const status=document.getElementById("status");const form=document.getElementById("form");
async function post(url,data){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||"No se pudo completar la operación.");return d;}
(async()=>{try{if(!token)throw new Error("Falta el código de activación.");const d=await post("/api/auth/password-setup/validate",{token});document.getElementById("userInfo").textContent="Cuenta: "+d.nombre+" ("+d.email+")";status.className="alert alert-success";status.textContent="Enlace válido. Puedes establecer tu contraseña.";form.hidden=false;}catch(e){status.className="alert alert-danger";status.textContent=e.message;}})();
form.addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("submit");btn.disabled=true;try{const d=await post("/api/auth/password-setup/complete",{token,password:document.getElementById("password").value,confirmacion:document.getElementById("confirmacion").value});form.hidden=true;status.className="alert alert-success";status.textContent=d.message+" Redirigiendo al inicio de sesión...";setTimeout(()=>location.href="/",1600);}catch(err){status.className="alert alert-danger";status.textContent=err.message;}finally{btn.disabled=false;}});
</script></body></html>
