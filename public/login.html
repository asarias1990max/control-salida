<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root { --login-blue: #2449a5; --login-ink: #17243b; --login-line: #e6ebf2; }
    body {
      min-height: 100vh; margin: 0; padding: 24px;
      display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--login-ink);
      background: radial-gradient(circle at 12% 12%, rgba(255,255,255,.16), transparent 28%),
                  linear-gradient(135deg, #172b5e 0%, #2449a5 58%, #7f9de3 100%);
    }
    .login-card {
      width: 100%; max-width: 410px; padding: 34px;
      border: 1px solid rgba(255,255,255,.75); border-radius: 22px;
      background: rgba(255,255,255,.98);
      box-shadow: 0 24px 70px rgba(10,25,61,.28);
    }
    .logo { font-size: 42px; color: var(--login-blue); }
    .title { font-weight: 750; letter-spacing: -.025em; color: var(--login-ink); }
    .login-card .form-control {
      min-height: 46px; border: 1px solid #dce4ef; border-radius: 11px;
    }
    .login-card .form-control:focus {
      border-color: #8da9e8; box-shadow: 0 0 0 .2rem rgba(36,73,165,.12);
    }
    .login-card .btn-primary {
      min-height: 45px; color: #fff; background: var(--login-blue);
      border: 0; border-radius: 11px; font-weight: 650;
      box-shadow: 0 6px 14px rgba(36,73,165,.18); transition: .18s ease;
    }
    .login-card .btn-primary:hover { background: #1d3679; transform: translateY(-1px); }
    .footer { font-size: 12px; color: #718096; }
    @media (max-width: 480px) { .login-card { padding: 26px 22px; border-radius: 18px; } }
  </style>
</head>

<body>

  <div class="login-card text-center">

    <!-- ICONO -->
    <div class="mb-3">
      <i class="bi bi-shield-lock-fill logo"></i>
    </div>

    <h4 class="title mb-4">Control de Salida</h4>

    <!-- INPUTS (SIN CAMBIAR IDs) -->
    <input type="text" id="user" class="form-control mb-3" placeholder="Usuario">

    <input type="password" id="pass" class="form-control mb-4" placeholder="Contraseña">

    <!-- BOTÓN (MISMA FUNCIÓN) -->
    <button onclick="login()" class="btn btn-primary w-100 mb-3">
      <i class="bi bi-box-arrow-in-right"></i> Ingresar
    </button>

    <!-- DIVISOR -->
    <div class="d-flex align-items-center mb-3">
      <hr class="flex-fill">
      <span class="px-2 text-muted small">o</span>
      <hr class="flex-fill">
    </div>

    <!-- BOTÓN GOOGLE -->
    <button onclick="loginWithGoogle()" class="btn btn-outline-dark w-100 mb-2" id="googleBtn">
      <i class="bi bi-google me-2"></i> Iniciar con Google
    </button>
    <div id="googleStatus" class="text-muted small mb-4">Cargando configuración de Google...</div>

    <div class="mt-4 footer">
      © 2026 Sistema Institucional
    </div>

  </div>

  <!-- TU JS ORIGINAL -->
  <script src="js/login.js">
  </script>

</body>
</html>
