<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #1f3c88, #4a69bd);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      border-radius: 15px;
      background: white;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }

    .logo {
      font-size: 40px;
      color: #1f3c88;
    }

    .title {
      font-weight: bold;
      color: #1f3c88;
    }

    .form-control {
      border-radius: 8px;
    }

    .btn-primary {
      background-color: #1f3c88;
      border: none;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn-primary:hover {
      background-color: #162d66;
    }

    .footer {
      font-size: 12px;
      color: gray;
    }
  </style>
</head>

<body>

  <div class="login-card text-center">

    <!-- ICONO -->
    <div class="mb-3">
      <i class="bi bi-shield-lock-fill logo"></i>
    </div>

    <h4 class="title mb-4">Control de Salida</h4>

    <!-- INPUTS (SIN CAMBIAR IDs) -->
    <input type="text" id="user" class="form-control mb-3" placeholder="Usuario">

    <input type="password" id="pass" class="form-control mb-4" placeholder="Contraseña">

    <!-- BOTÓN (MISMA FUNCIÓN) -->
    <button onclick="login()" class="btn btn-primary w-100">
      <i class="bi bi-box-arrow-in-right"></i> Ingresar
    </button>

    <div class="mt-4 footer">
      © 2026 Sistema Institucional
    </div>

  </div>

  <!-- TU JS ORIGINAL -->
  <script src="js/login.js">
  </script>

</body>
</html>
