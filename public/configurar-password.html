<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurar contraseña · Colegio Einstein</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#1d376d,#8ca9dc);font-family:"Segoe UI",system-ui,sans-serif}
    .card{width:min(100%,460px);border:0;border-radius:18px;box-shadow:0 20px 60px #10264b44}
    .form-control{min-height:46px}
  </style>
</head>
<body>
  <main class="card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="fw-bold small text-primary mb-2">COLEGIO EINSTEIN</div>
      <h1 class="h4 fw-bold">Configurar contraseña</h1>
      <p class="text-secondary small mb-0">Disponible únicamente para el administrador principal después de iniciar sesión con Google.</p>
    </div>
    <div id="estado" class="alert alert-info small" role="status">Verificando tu sesión...</div>
    <form id="formPassword" class="d-none">
      <label for="password" class="form-label">Nueva contraseña</label>
      <input id="password" class="form-control mb-3" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
      <label for="confirmacion" class="form-label">Confirmar contraseña</label>
      <input id="confirmacion" class="form-control mb-2" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
      <div class="form-text mb-3">Usa al menos 12 caracteres y no reutilices una contraseña de otro servicio.</div>
      <button id="guardar" class="btn btn-primary w-100" type="submit">Guardar contraseña</button>
    </form>
    <a class="btn btn-link mt-3 text-decoration-none" href="/">Volver al inicio de sesión</a>
  </main>
  <script>
    const estado = document.getElementById("estado");
    const formulario = document.getElementById("formPassword");
    const guardar = document.getElementById("guardar");

    async function iniciar() {
      try {
        const respuesta = await fetch("/api/auth/session", { credentials: "same-origin", cache: "no-store" });
        const datos = await respuesta.json();
        if (!respuesta.ok || !datos.ok) {
          estado.className = "alert alert-warning small";
          estado.textContent = "Primero inicia sesión con Google en este mismo entorno y vuelve a abrir esta página.";
          return;
        }
        if (String(datos.user?.email || "").toLowerCase() !== "asarias@einstein.k12.ec" || datos.user?.rol !== "admin") {
          estado.className = "alert alert-danger small";
          estado.textContent = "Esta función está reservada al administrador principal.";
          return;
        }
        estado.className = "alert alert-success small";
        estado.textContent = "Sesión de administrador verificada. Puedes establecer tu contraseña.";
        formulario.classList.remove("d-none");
      } catch {
        estado.className = "alert alert-danger small";
        estado.textContent = "No se pudo verificar la sesión. Intenta nuevamente.";
      }
    }

    formulario.addEventListener("submit", async event => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirmacion = document.getElementById("confirmacion").value;
      if (password.length < 12) {
        estado.className = "alert alert-warning small";
        estado.textContent = "La contraseña debe tener al menos 12 caracteres.";
        return;
      }
      if (password !== confirmacion) {
        estado.className = "alert alert-warning small";
        estado.textContent = "Las contraseñas no coinciden.";
        return;
      }
      guardar.disabled = true;
      guardar.textContent = "Guardando...";
      try {
        const respuesta = await fetch("/api/auth/password", {
          method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password, confirmacion })
        });
        const datos = await respuesta.json();
        estado.className = respuesta.ok && datos.ok ? "alert alert-success small" : "alert alert-danger small";
        estado.textContent = datos.message || "No se pudo guardar la contraseña.";
        if (respuesta.ok && datos.ok) {
          formulario.reset();
          formulario.classList.add("d-none");
        }
      } catch {
        estado.className = "alert alert-danger small";
        estado.textContent = "Error de conexión. Intenta nuevamente.";
      } finally {
        guardar.disabled = false;
        guardar.textContent = "Guardar contraseña";
      }
    });
    iniciar();
  </script>
</body>
</html>
